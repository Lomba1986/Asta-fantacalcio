<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asta Fanta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f7">
<link rel="apple-touch-icon" href="icon-v2.png">
<link rel="icon" type="image/png" href="icon-v2.png">
<title>Asta Fantacalcio 2026/27</title>
<style>
  :root{
    --pitch-dark: #eef1f7;
    --pitch: #ffffff;
    --pitch-line: #e4e8f2;
    --paper: #10162b;
    --ink: #eef1f7;
    --ink-soft: #8891a8;
    --chalk: #10162b;
    --amber: #e8a800;
    --amber-deep: #b8940a;
    --red: #d9463d;
    --green-ok: #16a35f;
    --border: #e0e5f0;
    --hero1: #3E63F5;
    --hero2: #5C82FA;
    --blue: #3E6FF0;
    --blue-deep: #2E52C7;
    --mono: 'Roboto Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow-anchor:none;}
  body{
    font-family:var(--sans);
    background:var(--pitch-dark);
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
  }
  /* subtle pitch stripe texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 40px, transparent 40px 80px);
    pointer-events:none; z-index:0;
  }

  /* ===== TOP BUDGET BAR (sempre a dimensione fissa, sticky) ===== */
  #budgetbar{
    position:sticky; top:0; z-index:50;
    overflow-anchor:none;
  }
  #heroBar{
    background:linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%);
    padding:14px 16px 34px;
    position:relative; overflow:hidden;
  }
  #heroBar::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(255,255,255,0.18), transparent 55%);
    pointer-events:none;
  }
  .hero-top{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .hero-title-row{display:flex; align-items:center; gap:10px;}
  .hero-badge{width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));}
  .hero-title{color:#fff;}
  .hero-title .eyebrow{font-size:9.5px; letter-spacing:0.06em; opacity:0.75; font-weight:600; text-transform:uppercase; white-space:nowrap;}
  .hero-title .main{font-size:19px; font-weight:800; margin-top:1px;}
  .hero-icons{display:flex; gap:8px;}
  .hero-icon-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.94); color:var(--blue-deep);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow:0 3px 8px rgba(20,40,120,0.25);
  }
  #statsCard{
    background:var(--pitch); border-radius:18px; margin:-22px 12px 0; position:relative; z-index:2;
    padding:14px 14px 10px; box-shadow:0 8px 24px rgba(30,50,120,0.12);
  }
  /* ===== PANNELLO ESPANDIBILE (fuori dalla barra sticky: aprirlo/chiuderlo non sposta
     mai lo scroll, si limita a spingere giù o su il contenuto sotto come qualunque testo) ===== */
  #extraPanel{
    display:none;
    background:var(--pitch); margin:0 12px; border-radius:0 0 18px 18px;
    padding:2px 14px 10px; box-shadow:0 8px 24px rgba(30,50,120,0.08);
  }
  #extraPanel.open{display:block;}
  .expand-toggle-bar{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:10px; padding:9px; border-radius:10px;
    background:#eef4ff; color:var(--blue); font-size:12.5px; font-weight:700;
    cursor:pointer; user-select:none;
  }
  .expand-toggle-bar .chev{font-size:14px; transition:transform 0.2s;}
  .expand-toggle-bar.open .chev{transform:rotate(180deg);}
  .bb-title{
    font-size:12px; letter-spacing:0.02em; color:#6b7488; margin:0 0 8px 2px;
    display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .bb-title input{
    width:48px; background:transparent; border:none; border-bottom:1px dotted #b7bdcc;
    color:#6b7488; font-family:var(--mono); font-size:12.5px; text-align:center;
  }
  .bb-row{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap;}
  .stat{
    flex:1 1 auto; min-width:78px;
    background:#f5f7fb;
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 10px;
  }
  .stat .lbl{font-size:10px; color:#8891a8; text-transform:uppercase; letter-spacing:0.05em;}
  .stat .val{font-family:var(--mono); font-size:21px; font-weight:800; color:var(--chalk); line-height:1.15;}
  .stat.hero{
    background:linear-gradient(135deg, #fff7e0, #fff3cf);
    border:1px solid var(--amber-deep);
    flex:1.4 1 140px;
  }
  .stat.hero .lbl{color:var(--amber-deep);}
  .stat.hero .val{color:#c98a00; font-size:28px;}
  #paceIndicator{
    margin-top:9px; padding:8px 10px; border-radius:10px; font-size:11.5px; line-height:1.4;
  }
  #paceIndicator.ok{background:#eafaf1; color:#1a7a4c;}
  #paceIndicator.mid{background:#fff7e0; color:#96700a;}
  #paceIndicator.bad{background:#fff0ee; color:#a0431f;}
  .roles-row{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .role-pill{
    font-family:var(--mono); font-size:12px; color:#232b45;
    background:#f5f7fb; border:1px solid var(--border);
    border-radius:20px; padding:3px 10px;
  }
  .role-pill b{color:var(--chalk);}
  .role-pill.full{color:#8891a8; border-color:#dbe2f0;}

  /* ===== OBIETTIVI DI BUDGET PER RUOLO ===== */
  #targetPanel{margin-top:9px; padding-top:9px; border-top:1px solid var(--pitch-line);}
  .tp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .tp-title{font-size:10.5px; color:#6b7488; text-transform:uppercase; letter-spacing:0.05em;}
  #tpSumWarn{font-family:var(--mono); font-size:11px; color:#8891a8;}
  #tpSumWarn.bad{color:var(--red);}
  .tp-row{display:grid; grid-template-columns:64px 1fr 78px; align-items:center; gap:8px; margin-bottom:5px;}
  .tp-label{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:12px; color:var(--chalk);}
  .tp-label input{
    width:34px; background:transparent; border:none; border-bottom:1px dotted #b7bdcc;
    color:var(--amber); font-family:var(--mono); font-size:12px; text-align:center; padding:2px 0;
  }
  .tp-bar-track{height:9px; border-radius:5px; background:rgba(255,255,255,0.05); overflow:hidden; position:relative;}
  .tp-bar-fill{height:100%; border-radius:5px; background:var(--green-ok); transition:width 0.25s;}
  .tp-bar-fill.warn{background:var(--amber);}
  .tp-bar-fill.over{background:var(--red);}
  .tp-nums{font-family:var(--mono); font-size:11px; color:#6b7488; text-align:right; white-space:nowrap; display:flex; align-items:center; justify-content:flex-end; gap:2px;}
  .tp-nums.over{color:var(--red);}
  .rolePctCrInput{
    width:34px; background:transparent; border:none; border-bottom:1px dotted #b7bdcc;
    color:var(--chalk); font-family:var(--mono); font-size:11px; text-align:right; padding:2px 0;
  }
  .rolePctCrInput:focus, .tp-label input:focus{outline:none; border-bottom:1px solid var(--blue);}

  /* ===== CONTROLS ===== */
  #controls{
    background:var(--pitch-dark);
    padding:10px 14px 8px;
    border-bottom:1px solid var(--pitch-line);
  }
  #searchwrap{position:relative;}
  #search{
    width:100%; padding:12px 14px 12px 38px; border-radius:10px;
    border:1px solid var(--border); background:#eef1f7; color:var(--chalk);
    font-size:16px; font-family:var(--sans);
  }
  #search:focus{outline:none; border-color:var(--blue);}
  #searchwrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5;}
  .filters{display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px;}
  .chip{
    flex:none; font-family:var(--mono); font-size:13px; padding:7px 13px;
    border-radius:20px; border:1px solid var(--border); background:transparent;
    color:#232b45; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--blue); border-color:var(--blue); color:#ffffff; font-weight:700;}
  .filters2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .toggle{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:#232b45;
    background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px;
    padding:6px 10px; cursor:pointer; user-select:none;
  }
  .toggle input{accent-color:var(--blue);}
  .toggle.on{color:var(--chalk); border-color:var(--blue);}
  #btnCallMode{border-color:var(--blue); color:var(--blue);}
  #btnCallMode.active-call{background:var(--blue); color:#fff;}
  #count{font-size:12px; color:#8891a8; margin-top:6px; padding-left:2px;}

  /* ===== LIST ===== */
  #list{padding:8px 10px 90px; position:relative; z-index:1;}
  .card{
    background:var(--pitch); border:1px solid var(--border); border-radius:14px;
    padding:12px 12px; margin-bottom:9px; box-shadow:0 2px 10px rgba(30,50,120,0.06);
    display:grid; grid-template-columns:1fr auto; gap:10px 12px; align-items:center;
  }
  .card.mine{border-color:var(--green-ok); background:linear-gradient(135deg, #eafaf1, #ffffff);}
  .card.other{opacity:0.42;}
  .p-main{min-width:0;}
  .p-name-row{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
  .p-name{font-size:16.5px; font-weight:700; color:var(--chalk);}
  .p-team{font-size:12.5px; color:#6b7488;}
  .role-badge{
    display:inline-block; width:20px; height:20px; line-height:20px; text-align:center;
    border-radius:6px; font-family:var(--mono); font-size:11.5px; font-weight:800; color:#10162b;
  }
  .role-P{background:#d8c25a;} .role-D{background:#6fa9d8;}
  .role-C{background:#8fd88a;} .role-A{background:#f0955f;}
  .p-meta{font-size:11.5px; color:#8891a8; margin-top:3px; font-family:var(--mono);}
  .tag{
    display:inline-block; font-size:10.5px; font-family:var(--mono); padding:2px 7px;
    border-radius:5px; margin-left:6px; vertical-align:middle;
  }
  .tag.scommessa{background:rgba(111,174,92,0.18); color:var(--green-ok); border:1px solid rgba(111,174,92,0.4);}
  .tag.evitare{background:rgba(193,73,60,0.18); color:#d9564f; border:1px solid rgba(193,73,60,0.4);}
  .rig-badge{
    display:inline-block; font-size:10.5px; font-family:var(--mono); padding:2px 7px;
    border-radius:5px; margin-left:6px; vertical-align:middle;
    background:rgba(232,168,0,0.15); color:#a67800; border:1px solid rgba(232,168,0,0.35);
  }
  .injury-badge{
    font-size:11px; font-family:var(--sans); font-weight:600; color:#a0431f;
    background:#fff3ee; border:1px solid #f0b8a0; border-radius:7px;
    padding:4px 8px; margin-top:5px; display:inline-block;
  }
  .injury-badge.susp{color:#a0431f; background:#ffeceb; border-color:#e8a8a3;}
  .injury-inline{
    font-size:10.5px; font-weight:700; color:#a0431f; white-space:nowrap;
  }
  .personal-badge{
    font-size:11.5px; font-family:var(--mono); color:#1f7ab8; margin-top:4px;
    background:rgba(111,150,216,0.10); border:1px solid rgba(111,150,216,0.3);
    border-radius:6px; padding:3px 7px; display:inline-block;
  }
  .personal-badge .not-found{color:#d9463d;}

  .p-price{text-align:right;}
  .price-max{font-family:var(--mono); font-size:24px; font-weight:800; color:var(--amber); line-height:1;}
  .price-cons{font-family:var(--mono); font-size:12px; color:#6b7488; margin-top:2px;}

  .p-actions{grid-column:1/-1; display:flex; gap:8px; margin-top:2px;}
  .btn{
    flex:1; padding:9px 8px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,255,255,0.03); color:var(--chalk); font-size:13px; font-family:var(--sans);
    cursor:pointer; text-align:center;
  }
  .btn.mine{border-color:var(--green-ok); color:var(--green-ok);}
  .btn.other{border-color:#c7ccd9; color:#7a8499;}
  .status-line{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
    font-size:13px; padding-top:2px;
  }
  .status-line .who{font-weight:700;}
  .status-line.mine-c .who{color:var(--green-ok);}
  .status-line.other-c .who{color:#7a8499;}
  .undo{font-size:12px; color:#d9463d; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:var(--sans);}

  .inline-form-wrap{grid-column:1/-1; display:flex; flex-direction:column; gap:8px;}
  .role-full-warn{
    background:#fff3ee; border:1px solid #f0b8a0; color:#a0431f;
    font-size:12px; padding:8px 10px; border-radius:8px; line-height:1.4;
  }
  .inline-form{grid-column:1/-1; display:flex; gap:8px; align-items:center;}
  .inline-form input{
    width:70px; padding:8px; border-radius:8px; border:1px solid var(--amber-deep);
    background:#eef1f7; color:var(--chalk); font-family:var(--mono); font-size:15px; text-align:center;
  }
  .inline-form select{
    flex:1; min-width:0; padding:8px 6px; border-radius:8px; border:1px solid var(--border);
    background:#eef1f7; color:var(--chalk); font-family:var(--sans); font-size:13px;
  }
  .inline-form button{
    padding:8px 14px; border-radius:8px; border:none; background:var(--amber); color:#10162b;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .inline-form .cancel{background:transparent; border:1px solid var(--border); color:#232b45; font-weight:400;}

  .empty{text-align:center; color:#98a1b3; padding:40px 20px; font-size:14px;}

  /* ===== BACKUP STATUS ===== */
  #backupbar{
    display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap;
    padding-top:8px; border-top:1px solid var(--pitch-line);
  }
  #bkStatus{font-size:11.5px; color:#8891a8;}
  #bkStatus.stale{color:var(--amber-deep);}
  #bkStatus.verystale{color:var(--red);}
  #toggleAutoBk{font-size:11px; gap:5px; padding:4px 8px;}

  /* ===== TABS ===== */
  .tabpanel{padding-bottom:78px;}
  #tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    display:flex; background:#ffffff;
    border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(30,50,120,0.10);
  }
  .tabbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:#9aa2b5; font-family:var(--sans);
    font-size:11px; font-weight:600; padding:6px 4px; border-radius:10px; cursor:pointer;
  }
  .tabbtn .ti{font-size:19px; line-height:1;}
  .tabbtn.active{color:var(--blue);}
  .tabbtn.active .ti{filter:drop-shadow(0 0 6px rgba(62,111,240,0.35));}

  /* ===== STRATEGIA TAB ===== */
  #strategiaContent{padding:12px 12px 20px;}
  .strat-mode-toggle{display:flex; gap:8px; margin:4px 0 14px;}
  .strat-mode-toggle .chip{flex:1; text-align:center; padding:10px 8px;}
  .strat-card{
    background:var(--pitch); border:1px solid var(--border); border-radius:12px;
    padding:14px 14px; margin-bottom:12px;
  }
  .strat-card h3{margin:0 0 10px; font-size:15px; color:var(--chalk); display:flex; align-items:center; gap:7px;}
  .strat-tip{display:flex; gap:8px; margin-bottom:9px; font-size:13.5px; color:#232b45; line-height:1.4;}
  .strat-tip b{color:var(--amber); flex:none;}
  .macro-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--pitch-line);}
  .macro-row:last-child{border-bottom:none;}
  .macro-role{font-weight:700; color:var(--chalk); font-size:13.5px;}
  .macro-detail{font-size:11.5px; color:#8891a8;}
  .macro-range{font-family:var(--mono); color:var(--amber); font-weight:700; font-size:14px;}
  .fascia-group{margin-bottom:12px;}
  .fascia-title{
    font-family:var(--mono); font-size:12px; color:var(--amber); text-transform:uppercase;
    letter-spacing:0.04em; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--pitch-line);
  }
  .fascia-player{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;}
  .fascia-player .fp-name{color:var(--chalk);}
  .fascia-player .fp-team{color:#8891a8; font-size:11.5px;}
  .fascia-player .fp-range{font-family:var(--mono); color:#1f7ab8; font-size:12.5px;}
  .best-stat{font-size:11px; color:#8891a8; font-family:var(--mono); margin-top:2px;}
  .price-src{font-size:9.5px; font-family:var(--sans); margin-top:1px;}
  .price-src.real{color:var(--green-ok);}
  .price-src.est{color:#98a1b3;}
  .role-section-head{
    display:flex; align-items:center; gap:8px; margin:18px 0 10px;
    font-size:15px; font-weight:800; color:var(--chalk);
  }
  .role-section-head .rb{
    width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:800; font-size:12px; color:#10162b;
  }
  .gk-row{
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
    background:rgba(255,255,255,0.02);
  }
  .gk-teams{font-weight:700; font-size:14px; color:var(--chalk);}
  .gk-players{font-size:13px; color:#1f7ab8; margin-top:3px;}
  .gk-range{font-family:var(--mono); font-size:12.5px; color:var(--amber); margin-top:3px;}

  /* ===== ROSA TAB ===== */
  #rosaContent{padding:0 12px 20px;}
  #teamSwitcher{padding:12px 12px 4px;}
  .team-list{
    background:#fff; border-radius:16px; overflow:hidden;
    box-shadow:0 2px 10px rgba(30,50,120,0.06); border:1px solid var(--border);
  }
  .team-row{
    width:100%; display:flex; align-items:center; gap:14px; padding:12px 14px;
    background:#fff; border:none; border-bottom:1px solid #eef1f7; cursor:pointer;
    text-align:left; font-family:var(--sans);
  }
  .team-row:last-child{border-bottom:none;}
  .team-row.active{background:#eef4ff;}
  .team-row-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .team-row-name{font-size:16px; font-weight:800; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .team-row.active .team-row-name{color:var(--blue-deep);}
  .team-row-sub{font-size:12.5px; color:#8891a8;}
  .team-row-chev{font-size:20px; color:#c7ccd9; font-weight:300;}
  .team-list-actions{display:flex; gap:8px; margin-top:10px;}
  .team-list-action-btn{
    flex:1; padding:10px; border-radius:12px; border:1px dashed var(--border); background:transparent;
    color:var(--blue); font-size:13px; font-weight:700; cursor:pointer; font-family:var(--sans);
  }
  .team-list-action-btn.active{background:var(--blue); border-style:solid; border-color:var(--blue); color:#fff;}
  .team-manage{display:flex; gap:8px; margin-bottom:10px;}
  .team-manage button{
    flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:#fff;
    color:#6b7488; font-size:12.5px; cursor:pointer; font-family:var(--sans);
  }
  .team-stats-row{display:flex; gap:8px; margin-bottom:12px;}
  .rosa-summary{
    display:flex; justify-content:space-between; background:var(--pitch); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:12px; font-family:var(--mono); font-size:13px; color:#232b45;
  }
  .rosa-role-block{margin-bottom:14px;}
  .rosa-role-title{font-family:var(--mono); font-size:12px; color:#6b7488; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;}
  .rosa-row{display:flex; justify-content:space-between; padding:8px 10px; border-bottom:1px solid var(--pitch-line); font-size:14.5px; background:var(--pitch); border-radius:8px; margin-bottom:4px;}
  .rosa-row .nm{color:var(--chalk);}
  .rosa-row .sq{color:#8891a8; font-size:12.5px;}
  .rosa-row .pr{font-family:var(--mono); color:var(--amber); font-weight:700;}
  .rosa-total{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:2px solid var(--border); font-size:15px; font-weight:700; color:var(--chalk);}
  .rosa-actions{display:flex; gap:8px; margin-top:16px;}
  .rosa-actions button{flex:1; padding:11px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans);}
  .rosa-actions .dl{background:var(--amber); color:#10162b; border:none;}
  .rosa-actions .cp{background:transparent; border:1px solid var(--border); color:var(--chalk);}
  .rosa-empty{text-align:center; color:#98a1b3; padding:30px 10px; font-size:14px;}

  #copyTextarea{position:absolute; left:-9999px;}
  #toast{
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:var(--green-ok); color:#eef1f7; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:700; z-index:200; opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  #toast.show{opacity:1;}

  @media (min-width:640px){
    #list{padding-left:16px; padding-right:16px;}
    .card{grid-template-columns:1fr auto auto;}
  }
</style>
</head>

function logMove(entry){
  moveLog.push({ts: Date.now(), ...entry});
  if(moveLog.length > 500) moveLog.shift(); // non crescere all'infinito in una sessione lunghissima
}

function teamName(id){
  if(id==='mine') return 'La tua rosa';
  const t = opponentTeams.find(t=>t.id===id);
  return t ? t.name : '—';
}
function teamLogo(id){
  if(id==='mine') return 'data:image/png;base64,'+MY_BADGE_B64;
  return TEAM_LOGOS_BY_ID[id] ? 'data:image/png;base64,'+TEAM_LOGOS_BY_ID[id] : null;
}
function teamLogoImgTag(id, size){
  const src = teamLogo(id);
  if(src) return `<img src="${src}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;vertical-align:middle;">`;
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:#dbe2f0;color:#6b7488;font-size:${size*0.45}px;font-weight:800;vertical-align:middle;">${(teamName(id)||'?').charAt(0)}</span>`;
}
function addOpponentTeam(){
  const name = prompt('Nome della nuova squadra:');
  if(!name || !name.trim()) return null;
  const t = {id: nextTeamId++, name: name.trim()};
  opponentTeams.push(t);
  markAction();
  return t;
}
function renameOpponentTeam(id){
  const t = opponentTeams.find(t=>t.id===id);
  if(!t) return;
  const name = prompt('Rinomina squadra:', t.name);
  if(!name || !name.trim()) return;
  t.name = name.trim();
  markAction();
  render();
}
function deleteOpponentTeam(id){
  if(!confirm('Eliminare questa squadra? I giocatori segnati come suoi torneranno "assegnati" senza squadra.')) return;
  opponentTeams = opponentTeams.filter(t=>t.id!==id);
  Object.keys(state).forEach(pid=>{
    if(state[pid].teamId===id) state[pid].teamId=null;
  });
  if(viewingTeamId===id) viewingTeamId='mine';
  markAction();
  render();
  if(currentTab==='rosa') renderRosaTab();
}
window.addOpponentTeam = addOpponentTeam;
window.renameOpponentTeam = renameOpponentTeam;
window.deleteOpponentTeam = deleteOpponentTeam;

function computeBudget(){
  let spentMine = 0;
  let filledByRole = {P:0,D:0,C:0,A:0};
  let spentByRole = {P:0,D:0,C:0,A:0};
  PLAYERS_DATA.forEach(p=>{
    const s = state[p.id];
    if(s.status==='mine'){
      spentMine += (s.price||0);
      filledByRole[p.r]++;
      spentByRole[p.r] += (s.price||0);
    }
  });
  const totalSlots = SLOTS.P+SLOTS.D+SLOTS.C+SLOTS.A;
  const filledTotal = filledByRole.P+filledByRole.D+filledByRole.C+filledByRole.A;
  const emptySlots = totalSlots - filledTotal;
  const remaining = budgetTotal - spentMine;
  // max offribile ora = crediti rimasti - 1 credito riservato per ciascuno degli ALTRI slot ancora vuoti
  const otherEmpty = Math.max(0, emptySlots - 1);
  const maxNow = Math.max(0, remaining - otherEmpty);

  document.getElementById('statSpeso').textContent = spentMine;
  document.getElementById('statRimasto').textContent = remaining;
  document.getElementById('statSlot').textContent = emptySlots;
  document.getElementById('statMax').textContent = emptySlots<=0 ? '—' : maxNow;

  updatePaceIndicator(spentMine, filledTotal, remaining, emptySlots);

  const rr = document.getElementById('rolesRow');
  rr.innerHTML = '';
  ['P','D','C','A'].forEach(r=>{
    const filled = filledByRole[r];
    const need = SLOTS[r];
    const pill = document.createElement('div');
    pill.className = 'role-pill' + (filled>=need ? ' full' : '');
    pill.innerHTML = `${r} <b>${filled}</b>/${need}`;
    rr.appendChild(pill);
  });

  updateTargetPanel(spentByRole);
}

/// Confronta quanto hai speso finora per giocatore con quanto potrai permetterti in media
/// per gli slot che restano, per capire se stai andando più veloce o più lento del previsto.
function updatePaceIndicator(spentMine, filledTotal, remaining, emptySlots){
  const el = document.getElementById('paceIndicator');
  if(!el) return;
  if(filledTotal===0 || emptySlots===0){
    el.style.display = 'none';
    return;
  }
  const avgPaid = spentMine/filledTotal;
  const avgLeft = remaining/emptySlots;
  const ratio = avgPaid>0 ? avgLeft/avgPaid : 2;

  let cls, msg;
  if(ratio >= 1.15){
    cls = 'ok';
    msg = `Ritmo tranquillo: hai pagato in media <b>${avgPaid.toFixed(1)}cr</b>/giocatore, per i ${emptySlots} rimasti ne hai ancora <b>${avgLeft.toFixed(1)}cr</b> a testa.`;
  } else if(ratio >= 0.85){
    cls = 'mid';
    msg = `Ritmo in linea: <b>${avgPaid.toFixed(1)}cr</b>/giocatore finora, <b>${avgLeft.toFixed(1)}cr</b> di media per i ${emptySlots} rimasti.`;
  } else {
    cls = 'bad';
    msg = `⚠️ Stai spendendo veloce: <b>${avgPaid.toFixed(1)}cr</b>/giocatore finora, ma per i ${emptySlots} rimasti hai in media solo <b>${avgLeft.toFixed(1)}cr</b> a testa.`;
  }
  el.className = 'pace-indicator ' + cls;
  el.style.display = 'block';
  el.innerHTML = msg;
}

function buildTargetPanelSkeleton(){
  const rows = document.getElementById('tpRows');
  rows.innerHTML = ['P','D','C','A'].map(r=>`
    <div class="tp-row">
      <span class="tp-label">${r} <input type="number" class="rolePctInput" id="pctInput-${r}" data-role="${r}" min="0" max="100">%</span>
      <span class="tp-bar-track"><span class="tp-bar-fill" id="bar-${r}" style="width:0%"></span></span>
      <span class="tp-nums" id="nums-${r}">
        <span id="spent-${r}">0</span>/<input type="number" class="rolePctCrInput" id="crInput-${r}" data-role="${r}" min="0">cr
      </span>
    </div>`).join('');

  rows.querySelectorAll('.rolePctInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const r = e.target.dataset.role;
      const v = parseInt(e.target.value,10);
      rolePct[r] = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
      computeBudget();
      document.getElementById('strategiaContent').dataset.built = '';
      if(currentTab==='best') renderBestTab();
      if(currentTab==='strategia' && strategiaMode==='budget') renderStrategiaTab();
    });
  });
  rows.querySelectorAll('.rolePctCrInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const r = e.target.dataset.role;
      const v = parseInt(e.target.value,10);
      const credits = isNaN(v) ? 0 : Math.max(0, v);
      rolePct[r] = budgetTotal>0 ? Math.round(credits/budgetTotal*100) : 0;
      computeBudget();
      document.getElementById('strategiaContent').dataset.built = '';
      if(currentTab==='best') renderBestTab();
      if(currentTab==='strategia' && strategiaMode==='budget') renderStrategiaTab();
    });
  });
  targetPanelBuilt = true;
}

function updateTargetPanel(spentByRole){
  if(!targetPanelBuilt) buildTargetPanelSkeleton();

  const sumPct = rolePct.P + rolePct.D + rolePct.C + rolePct.A;
  const warnEl = document.getElementById('tpSumWarn');
  warnEl.textContent = `tot ${sumPct}%`;
  warnEl.classList.toggle('bad', sumPct !== 100);

  ['P','D','C','A'].forEach(r=>{
    const target = Math.round(budgetTotal * rolePct[r]/100);
    const spent = spentByRole[r];
    const pct = target>0 ? Math.min(100, spent/target*100) : 0;
    const isOver = spent > target;
    const barClass = isOver ? 'over' : (pct>=85 ? 'warn' : '');

    const bar = document.getElementById(`bar-${r}`);
    bar.style.width = pct+'%';
    bar.className = 'tp-bar-fill' + (barClass ? ' '+barClass : '');
    document.getElementById(`spent-${r}`).textContent = spent;
    document.getElementById(`nums-${r}`).classList.toggle('over', isOver);

    const pctInput = document.getElementById(`pctInput-${r}`);
    const crInput = document.getElementById(`crInput-${r}`);
    // Never overwrite the value of whichever input the user is actively typing in —
    // that's what was stealing focus/cursor on every keystroke before.
    if(document.activeElement !== pctInput) pctInput.value = rolePct[r];
    if(document.activeElement !== crInput) crInput.value = target;
  });
}

function fmtTag(tag){
  if(tag==='scommessa') return '<span class="tag scommessa">scommessa</span>';
  if(tag==='evitare') return '<span class="tag evitare">evitare</span>';
  return '';
}
function fmtPersonal(p){
  if(!p.personal) return '';
  return `<div class="personal-badge">📝 ${p.personal.label} · ${p.personal.lo}-${p.personal.hi}cr${p.nonInListone ? ' <span class="not-found">(non nel listone attuale)</span>' : ''}</div>`;
}
function fmtRigorista(p){
  const st = (typeof STAT_BY_ID !== 'undefined') ? STAT_BY_ID[p.id] : null;
  if(!st || !st.rigorista) return '';
  return `<span class="rig-badge">🎯 ${st.rigorista}</span>`;
}
const INJURY_BY_ID = {};
INJURY_DATA.forEach(inj => INJURY_BY_ID[inj.id] = inj);
function fmtInjury(p){
  const inj = INJURY_BY_ID[p.id];
  if(!inj) return '';
  if(inj.squalificato){
    return `<div class="injury-badge susp">🟥 Squalificato — ${inj.dettaglioSqualifica}</div>`;
  }
  return `<div class="injury-badge">🤕 ${inj.tipo} — rientro ${inj.rientro}</div>`;

/// Versione compatta, in linea col nome (per righe strette tipo "Chi chiamare"),
/// invece del badge a blocco usato nella card grande della lista principale.
function fmtInjuryInline(p){
  const inj = INJURY_BY_ID[p.id];
  if(!inj) return '';
  const label = inj.squalificato ? `🟥 salta ${inj.dettaglioSqualifica.replace('Salta ','')}` : `🤕 rientro ${inj.rientro}`;
  return ` <span class="injury-inline">${label}</span>`;
}

function matchesFilters(p){
  if(filters.role!=='ALL' && p.r!==filters.role) return false;
  if(filters.onlyRec && p.tag==='') return false;
  if(filters.onlyPersonal && !p.personal) return false;
  if(filters.hideAssigned && state[p.id].status!=='free') return false;
  if(filters.hideInjury && INJURY_BY_ID[p.id]) return false;
  if(filters.q){
    const q = filters.q.toLowerCase();
    if(!p.nome.toLowerCase().includes(q) && !p.squadra.toLowerCase().includes(q)) return false;
  }
  return true;
}

  const list = document.getElementById('list');

        bottom = `<div class="inline-form-wrap">

function toggleCallMode(){
  callModeActive = !callModeActive;
  if(callModeActive && filters.role==='ALL'){
    filters.role = 'P';
    callModeRole = 'P';
    document.querySelectorAll('#roleFilters .chip').forEach(c=>c.classList.toggle('active', c.dataset.role==='P'));
  } else if(callModeActive){
    callModeRole = filters.role;
  }
  document.getElementById('btnCallMode').classList.toggle('active-call', callModeActive);
  render();
}

/// Quante squadre avversarie (tra quelle tracciate in Squadre) hanno ancora uno slot
/// vuoto in questo ruolo. È un segnale strutturale, non psicologico: più squadre sono
/// ancora scoperte, più è probabile che un nome forte in quel ruolo scateni un rilancio.
function opponentsStillNeeding(role){
  let count = 0;
  opponentTeams.forEach(t=>{
    let filled = 0;
    PLAYERS_DATA.forEach(p=>{
      if(p.r===role && state[p.id].status==='other' && state[p.id].teamId===t.id) filled++;
    });
    if(filled < SLOTS[role]) count++;
  });
  return count;
}

function renderCallMode(){
  const el = document.getElementById('callModeContent');
  const role = filters.role;

  if(role==='ALL'){
    el.innerHTML = `<div class="empty">Scegli un reparto qui sopra (P, D, C o A) per vedere chi conviene chiamare — si parte di solito dai portieri.</div>`;
    return;
  }
  callModeRole = role;

  const free = PLAYERS_DATA.filter(p=> p.r===role && state[p.id].status==='free' && p.rilevante);
  const nOpp = opponentTeams.length;
  const needing = opponentsStillNeeding(role);

  // 1) Miei obiettivi: qualità migliore ancora alla mia portata, con priorità a chi è nella mia lista fasce.
  // Infortunati inclusi (li segnalo con un avviso): un top che rientra presto può restare un ottimo acquisto.
  const myBudgetCap = Math.max(1, maxOfferNowValue());
  const obiettivi = free.filter(p=>p.prezzo<=myBudgetCap)
    .sort((a,b)=> (b.personal?1:0)-(a.personal?1:0) || b.prezzo-a.prezzo)
    .slice(0,6);

  // 2) Falli scannare: prezzo alto (nomi che smuovono un'asta), tra chi NON è in cima
  // ai miei obiettivi, ordinati mettendo in evidenza chi serve a più squadre avversarie
  const obiettiviIds = new Set(obiettivi.map(p=>p.id));
  const scannare = free.filter(p=> !obiettiviIds.has(p.id) && p.prezzo>=8)
    .sort((a,b)=> b.prezzo-a.prezzo)
    .slice(0,6);

  // 3) Robaccia: quasi gratis, buoni da chiamare per far passare il turno o coprire uno slot
  const robaccia = free.filter(p=> p.prezzo<=3)
    .sort((a,b)=> b.fvm-a.fvm)
    .slice(0,6);

  function group(title, emoji, players, note, accent){
    let html = `<div class="strat-card" style="margin:0 0 12px;">
      <h3 style="font-size:14.5px; color:${accent};">${emoji} ${title}</h3>
      <div class="sub" style="font-size:12px; color:#6b7488; margin-bottom:10px;">${note}</div>`;
    if(players.length===0){
      html += `<div style="font-size:13px; color:#98a1b3; padding:6px 0;">Nessuno disponibile al momento in questo reparto.</div>`;
    } else {
      players.forEach(p=>{
        html += `<div class="fascia-player">
          <span class="fp-name">${p.nome} <span class="fp-team">${p.squadra}</span>${p.personal ? ' 📝' : ''}${fmtInjuryInline(p)}</span>
          <span style="display:flex; align-items:center; gap:8px;">
            <span class="fp-range" style="color:var(--amber-deep); font-weight:700;">${p.prezzo}cr</span>
            <button class="btn mine" style="padding:5px 10px; font-size:12px;" onclick="quickTakeMine(${p.id})">Preso</button>
          </span>
        </div>`;
      });
    }
    html += `</div>`;
    return html;
  }

  let html = `<div class="strat-card" style="margin:0 0 12px; background:#eef4ff; border-color:var(--blue);">
    <div style="font-size:12.5px; color:var(--blue-deep);">
      📊 In <b>${ROLE_LABEL[role]}</b>, <b>${needing}/${nOpp}</b> squadre avversarie tracciate hanno ancora uno slot vuoto in questo reparto.
      ${nOpp===0 ? '<br><b>Nessuna squadra avversaria censita</b> — vai nella tab Squadre e aggiungile per un segnale più utile qui.' : ''}
    </div>
  </div>`;

  html += group('Miei Obiettivi', '🎯', obiettivi,
    `Ancora liberi, ${ROLE_LABEL[role].toLowerCase()}, dentro il tuo massimo offribile attuale (${myBudgetCap}cr). Priorità a chi è nella tua lista fasce.`,
    'var(--blue)');
  html += group('Falli Scannare', '⚔️', scannare,
    needing>0 ? `Nomi pesanti ancora liberi — con ${needing} squadre ancora scoperte in questo reparto, chiamarli ora può accendere un rilancio a cui tu puoi anche non partecipare.` : `Nomi pesanti ancora liberi, ma al momento nessuna avversaria censita risulta ancora scoperta qui: il rilancio è meno garantito.`,
    'var(--red)');
  html += group('Robaccia', '🗑️', robaccia,
    `Quasi gratis — buoni per far passare il turno, coprire uno slot, o far scendere in campo qualcun altro senza rischi.`,
    '#8891a8');

  el.innerHTML = html;
}

function quickTakeMine(id){

  logMove({playerId:id, nome:p.nome, ruolo:p.r, squadraCalcio:p.squadra, azione:'preso', status:'mine', teamId:null, price:p.prezzo});
  markAction();
  render();

  if(currentTab==='best') renderBestTab();

  render();

}
function cancelForm(){ openForm=null; render(); }
function handleTeamSelectChange(sel){
  if(sel.value === '__new__'){
    const t = addOpponentTeam();
    if(t){
      openForm.teamId = t.id;
      render();
      // re-select the newly added team after re-render
      const newSel = document.getElementById('teamSelect');

    } else {
      sel.value = openForm.teamId || '';
    }
  } else {
    openForm.teamId = sel.value ? parseInt(sel.value,10) : null;
    render();
    const newSel = document.getElementById('teamSelect');
    if(newSel) newSel.value = openForm.teamId || '';

    if(priceInput) priceInput.focus();
  }
}
window.handleTeamSelectChange = handleTeamSelectChange;
function confirmTake(id){
  const input = document.getElementById('priceInput');
  const p = PLAYERS_DATA.find(x=>x.id===id);
  let val = parseInt(input.value, 10);
  if(isNaN(val) || val<1) val = p.prezzo;
  const mode = openForm.mode;
  const teamId = mode==='other' ? (openForm.teamId||null) : null;
  state[id] = {status: mode, price: val, teamId};
  logMove({playerId:id, nome:p.nome, ruolo:p.r, squadraCalcio:p.squadra, azione:'preso', status:mode, teamId, price:val});
  openForm = null;
  markAction();
  // Se dopo questa presa la ricerca attiva non troverebbe più nessuno (es. hai cercato
  // "Dimarco", l'hai preso, e "Nascondi assegnati" nasconde anche lui), la lista sembra
  // svuotarsi del tutto. Puliamo la ricerca in automatico per evitare quell'effetto.
  if(filters.q && PLAYERS_DATA.filter(matchesFilters).length===0){
    filters.q = '';
    const searchInput = document.getElementById('search');
    if(searchInput) searchInput.value = '';
  }
  render();
  updateBkStatus();
  if(currentTab==='best') renderBestTab();
}
function undoTake(id){
  const p = PLAYERS_DATA.find(x=>x.id===id);
  const prev = state[id];
  if(p && prev && prev.status!=='free'){
    logMove({playerId:id, nome:p.nome, ruolo:p.r, squadraCalcio:p.squadra, azione:'annullato', status:prev.status, teamId:prev.teamId, price:prev.price});
  }
  state[id] = {status:'free', price:null, teamId:null};
  markAction();
  render();
  updateBkStatus();
  if(currentTab==='best') renderBestTab();
}
window.confirmTake = confirmTake;
window.undoTake = undoTake;
window.openTakeForm = openTakeForm;
window.cancelForm = cancelForm;

/* ===================== BACKUP SU FILE (niente localStorage) ===================== */
let lastSaveAt = null;
let actionsSinceSave = 0;
let autoBackupEnabled = false;
let autoBackupEvery = 5;

function pad(n){ return n<10 ? '0'+n : ''+n; }
function tsForFilename(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/// Chiamata da ogni azione che modifica lo stato (preso/annulla/squadra creata...).
/// Tiene il contatore per l'indicatore "mosse non salvate" e, se l'auto-backup è
/// attivo, scarica da sola una nuova copia ogni N mosse — nessun tap richiesto.
function markAction(){
  actionsSinceSave++;
  if(autoBackupEnabled && actionsSinceSave >= autoBackupEvery){
    saveBackup(true);
  }
}

function buildBackupPayload(){
  return {
    savedAt: new Date().toISOString(),
    budgetTotal: budgetTotal,
    rolePct: rolePct,
    opponentTeams: opponentTeams,
    nextTeamId: nextTeamId,
    autoBackupEnabled: autoBackupEnabled,
    autoBackupEvery: autoBackupEvery,
    moveLog: moveLog,
    state: state
  };
}
function saveBackup(silent){
  const payload = buildBackupPayload();
  downloadBlob(JSON.stringify(payload, null, 2), `asta_backup_${tsForFilename()}.json`, 'application/json');
  lastSaveAt = new Date();
  actionsSinceSave = 0;
  updateBkStatus();
  showToast(silent ? 'Auto-backup salvato ✓' : 'Backup salvato ✓');
}

/// Condivisione one-tap: apre il pannello nativo di iOS (WhatsApp, Mail, AirDrop, Messaggi...)
/// con il file di backup già allegato. L'invio vero e proprio resta comunque un tap
/// tuo dentro l'app che scegli — è una barriera di sicurezza dei browser, non aggirabile.
async function shareBackup(){
  const payload = buildBackupPayload();
  const json = JSON.stringify(payload, null, 2);
  const filename = `asta_backup_${tsForFilename()}.json`;
  const file = new File([json], filename, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files: [file],
        title: 'Backup asta fantacalcio',
        text: "Backup dell'asta — " + new Date().toLocaleString('it-IT')
      });
      lastSaveAt = new Date();
      actionsSinceSave = 0;
      updateBkStatus();
      showToast('Backup inviato ✓');
    }catch(err){
      // utente ha annullato la condivisione: nessun errore da mostrare
      if(err.name !== 'AbortError') showToast('Condivisione annullata');
    }
  } else {
    // Browser che non supporta la condivisione di file: scarico e basta,
    // l'utente lo allega a mano.
    downloadBlob(json, filename, 'application/json');
    lastSaveAt = new Date();
    actionsSinceSave = 0;
    updateBkStatus();
    showToast('Condivisione diretta non supportata: file scaricato, allegalo a mano');
  }
}
function loadBackupFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const payload = JSON.parse(e.target.result);
      if(payload.budgetTotal){
        budgetTotal = payload.budgetTotal;
        document.getElementById('budgetInput').value = budgetTotal;
      }
      if(payload.rolePct){
        rolePct = payload.rolePct;
      }
      if(payload.opponentTeams){
        opponentTeams = payload.opponentTeams;
      }
      if(payload.nextTeamId){
        nextTeamId = payload.nextTeamId;
      }
      if(typeof payload.autoBackupEnabled === 'boolean'){
        autoBackupEnabled = payload.autoBackupEnabled;
        document.getElementById('chkAutoBk').checked = autoBackupEnabled;
        document.getElementById('toggleAutoBk').classList.toggle('on', autoBackupEnabled);
      }
      if(payload.autoBackupEvery){
        autoBackupEvery = payload.autoBackupEvery;
        document.getElementById('autoBkEvery').value = autoBackupEvery;
      }
      if(payload.moveLog){
        moveLog = payload.moveLog;
      }
      if(payload.state){
        Object.keys(payload.state).forEach(idStr=>{
          const id = parseInt(idStr,10);
          if(state.hasOwnProperty(id)) state[id] = payload.state[idStr];
        });
      }
      viewingTeamId = 'mine';
      lastSaveAt = payload.savedAt ? new Date(payload.savedAt) : new Date();
      actionsSinceSave = 0;
      render();
      document.getElementById('strategiaContent').dataset.built = '';
      if(currentTab==='rosa') renderRosaTab();
      if(currentTab==='strategia') renderStrategiaTab();
      if(currentTab==='best') renderBestTab();
      updateBkStatus();
      showToast('Backup caricato ✓');
    }catch(err){
      alert('File non valido o corrotto. Riprova con un altro backup.');
    }
  };
  reader.readAsText(file);
}
function updateBkStatus(){
  const el = document.getElementById('bkStatus');
  el.classList.remove('stale','verystale');
  if(!lastSaveAt){
    el.textContent = 'nessun backup ancora — salva prima di iniziare';
    if(actionsSinceSave>0) el.classList.add('verystale');
    return;
  }
  const mins = Math.round((Date.now()-lastSaveAt.getTime())/60000);
  el.textContent = `ultimo backup: ${mins<1?'ora':mins+' min fa'}${actionsSinceSave>0 ? ' · '+actionsSinceSave+' mosse non salvate':''}`;
  if(actionsSinceSave>=5) el.classList.add('verystale');
  else if(actionsSinceSave>=2) el.classList.add('stale');
}

function isRoleFullFor(teamId, role){
  let filled = 0;
  PLAYERS_DATA.forEach(p=>{
    if(p.r!==role) return;
    const st = state[p.id];
    if(teamId==='mine' && st.status==='mine') filled++;
    else if(teamId!=='mine' && st.status==='other' && st.teamId===teamId) filled++;
  });
  return filled >= SLOTS[role];
}

function buildRosaData(teamId){
  const isMine = teamId==='mine';
  const roster = PLAYERS_DATA.filter(p=>{
    const s = state[p.id];
    return isMine ? s.status==='mine' : (s.status==='other' && s.teamId===teamId);
  }).map(p=>({...p, paid: state[p.id].price}));
  const byRole = {P:[],D:[],C:[],A:[]};
  roster.forEach(p=>byRole[p.r].push(p));
  Object.values(byRole).forEach(arr=>arr.sort((a,b)=>b.paid-a.paid));
  const total = roster.reduce((s,p)=>s+p.paid,0);
  return {roster, byRole, total};
}

function loadImg(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = src;
  });
}
function drawRoundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasTokens(ctx, tokens, maxWidth){
  const lines = [];
  let cur = '';
  tokens.forEach(tok=>{
    const candidate = cur ? cur + '   ' + tok : tok;
    if(cur && ctx.measureText(candidate).width > maxWidth){
      lines.push(cur);
      cur = tok;
    } else {
      cur = candidate;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

const ROLE_IMG_LABEL = {P:'PORTIERI', D:'DIFENSORI', C:'CENTROCAMPISTI', A:'ATTACCANTI'};
const ROLE_IMG_COLOR = {P:'#c9a012', D:'#4f8fd1', C:'#4a9e57', A:'#d9713f'};

async function exportResultsImage(){
  showToast('Genero immagine…');
  const allTeams = [{id:'mine', name:teamName('mine')}, ...opponentTeams];
  const teamsData = allTeams.map(t=>{
    const {total, roster, byRole} = buildRosaData(t.id);
    const need = SLOTS.P+SLOTS.D+SLOTS.C+SLOTS.A;
    return {id:t.id, name:t.name, total, count:roster.length, byRole,
             remaining: budgetTotal - total, need};
  });
  const mine = teamsData.find(r=>r.id==='mine');
  const others = teamsData.filter(r=>r.id!=='mine').sort((a,b)=> b.total - a.total);
  const ordered = [mine, ...others];

  const W = 1080;
  const cardX = 40;
  const cardW = W - 80;
  const contentW = cardW - 48; // margine interno delle righe
  const roleLabelW = 190;
  const roleTextMaxW = contentW - roleLabelW;
  const textLineH = 24;      // altezza di ogni riga di giocatori (dentro un ruolo)
  const roleTitleH = 26;     // spazio riservato all'etichetta del ruolo (allineata alla prima riga)
  const teamHeaderH = 108;
  const roleBlockGap = 10;
  const teamGap = 26;
  const headerH = 300;
  const footerH = 60;

  // --- passata di misurazione (canvas 1x1, stesso font che useremo poi) ---
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = '500 22px -apple-system, sans-serif';

  function roleTokens(list){
    return list.map(p=> `${p.nome} ${p.paid}cr`);
  }
  function computeTeamHeight(t){
    let h = teamHeaderH;
    let any = false;
    ['P','D','C','A'].forEach(r=>{
      const list = t.byRole[r];
      if(!list || list.length===0) return;
      any = true;
      const lines = wrapCanvasTokens(mctx, roleTokens(list), roleTextMaxW);
      h += Math.max(roleTitleH, lines.length*textLineH) + roleBlockGap;
    });
    if(!any) h += 44; // riga placeholder "nessun giocatore"
    return h;
  }
  const teamHeights = ordered.map(computeTeamHeight);
  const totalTeamsH = teamHeights.reduce((a,b)=>a+b,0) + teamGap*(ordered.length-1);

  const cardTop = headerH - 26;
  const H = cardTop + totalTeamsH + 60 + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // sfondo
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0a1428');
  bgGrad.addColorStop(1,'#111f3d');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  // hero header con gradiente blu
  const heroGrad = ctx.createLinearGradient(0,0,W,headerH);
  heroGrad.addColorStop(0,'#3E63F5');
  heroGrad.addColorStop(1,'#5C82FA');
  ctx.fillStyle = heroGrad;
  ctx.fillRect(0,0,W,headerH);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '600 26px -apple-system, sans-serif';
  ctx.fillText('🏆 CHAMPIONS TRIP', W/2, 90);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 52px -apple-system, sans-serif';
  ctx.fillText('Risultati Asta', W/2, 165);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '500 24px -apple-system, sans-serif';
  ctx.fillText('Stagione 2026/27 · Budget ' + budgetTotal + ' crediti', W/2, 210);

  const dateStr = new Date().toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'});
  ctx.font = '400 18px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(dateStr, W/2, 245);

  // card bianca con angoli arrotondati che contiene tutte le squadre
  drawRoundedRect(ctx, cardX, cardTop, cardW, H - cardTop - footerH + 20, 26);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(20,40,120,0.25)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 10;
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  const logos = await Promise.all(ordered.map(r=> loadImg(teamLogo(r.id) || '')));

  let y = cardTop + 30;
  for(let i=0;i<ordered.length;i++){
    const t = ordered[i];
    const isMine = t.id==='mine';
    const blockH = teamHeights[i];
    const rowX = cardX + 24;
    const rowW = contentW;

    if(isMine){
      drawRoundedRect(ctx, rowX-10, y-12, rowW+20, blockH-4, 16);
      ctx.fillStyle = 'rgba(62,111,240,0.06)';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#3E6FF0';
      drawRoundedRect(ctx, rowX-10, y-12, rowW+20, blockH-4, 16);
      ctx.stroke();
    } else if(i>0){
      ctx.strokeStyle = '#e4e8f2'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(rowX-10, y-14); ctx.lineTo(rowX+rowW+10, y-14); ctx.stroke();
    }

    // logo circolare
    const logoSize = 64;
    const lx = rowX, ly = y;
    ctx.save();
    ctx.beginPath();
    ctx.arc(lx+logoSize/2, ly+logoSize/2, logoSize/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.fillStyle = '#eef1f7';
    ctx.fill();
    ctx.clip();
    const img = logos[i];
    if(img) ctx.drawImage(img, lx, ly, logoSize, logoSize);
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#10162b';
    ctx.font = '800 27px -apple-system, sans-serif';
    ctx.fillText(t.name + (isMine ? '  ⭐' : ''), lx+logoSize+20, ly+26);

    ctx.font = '500 17px -apple-system, sans-serif';
    ctx.fillStyle = '#8891a8';
    ctx.fillText(t.count + '/' + t.need + ' giocatori', lx+logoSize+20, ly+52);

    ctx.textAlign = 'right';
    ctx.font = '800 26px -apple-system, sans-serif';
    ctx.fillStyle = '#e8a800';
    ctx.fillText('Speso ' + t.total + 'cr', rowX+rowW, ly+26);
    ctx.font = '600 18px -apple-system, sans-serif';
    ctx.fillStyle = t.remaining<0 ? '#d9463d' : '#5f9e78';
    ctx.fillText('Rimasto ' + t.remaining + 'cr', rowX+rowW, ly+52);

    let ry = ly + teamHeaderH;
    let anyRole = false;
    ['P','D','C','A'].forEach(r=>{
      const list = t.byRole[r];
      if(!list || list.length===0) return;
      anyRole = true;
      const sorted = list.slice().sort((a,b)=> b.paid-a.paid);
      const lines = wrapCanvasTokens(ctx, roleTokens(sorted), roleTextMaxW);

      ctx.textAlign = 'left';
      ctx.font = '800 15px -apple-system, sans-serif';
      ctx.fillStyle = ROLE_IMG_COLOR[r];
      ctx.fillText(ROLE_IMG_LABEL[r], rowX, ry+14);

      ctx.font = '500 16.5px -apple-system, sans-serif';
      ctx.fillStyle = '#232b45';
      lines.forEach((line, li)=>{
        ctx.fillText(line, rowX+roleLabelW, ry+14+li*textLineH);
      });
      ry += Math.max(roleTitleH, lines.length*textLineH) + roleBlockGap;
    });
    if(!anyRole){
      ctx.textAlign = 'left';
      ctx.font = '500 17px -apple-system, sans-serif';
      ctx.fillStyle = '#98a1b3';
      ctx.fillText('Nessun giocatore ancora assegnato', rowX, ry+16);
    }

    y += blockH + teamGap;
  }

  ctx.textAlign = 'center';
  ctx.font = '500 16px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText("Generato con la tua app d'asta — Spartak Mooseca", W/2, H-24);

  const filename = 'champions_trip_risultati_'+tsForFilename()+'.png';
  canvas.toBlob(async blob=>{
    if(!blob){ showToast("Errore nella generazione dell'immagine"); return; }
    const file = new File([blob], filename, {type:'image/png'});
    // Su iOS Safari il download automatico spesso non "salva" un'immagine, la apre soltanto:
    // la condivisione nativa (Salva su Foto / invia) è molto più affidabile per un PNG.
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Champions Trip — Risultati asta'});
        showToast('Immagine pronta ✓');
        return;
      }catch(err){
        if(err.name==='AbortError'){ return; }
        // se la condivisione fallisce per qualche motivo, ripiega sull'apertura in una nuova scheda
      }
    }
    // Fallback: apri l'immagine in una nuova scheda così si può tenere premuto e "Salva immagine"
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    showToast(win ? 'Immagine aperta: tieni premuto per salvarla ✓' : 'Immagine scaricata ✓');
    setTimeout(()=>URL.revokeObjectURL(url), 15000);
  }, 'image/png');
}

/// Strategia alternativa "viva": non è scritta a mano, si ricalcola ogni volta che cambi
/// gli obiettivi budget o il totale crediti nella home. Riscala i prezzi del modello
/// (calibrati a 500cr con P9/D22/C32/A37) in proporzione a cosa hai impostato ora.
const STRATEGIA_BASELINE_PCT = {P:9, D:22, C:32, A:37};
const STRATEGIA_BASELINE_BUDGET = 500;
function liveScaleFactor(role){
  const baseRoleBudget = STRATEGIA_BASELINE_BUDGET * STRATEGIA_BASELINE_PCT[role]/100;
  const curRoleBudget = budgetTotal * (rolePct[role]||0)/100;
  if(baseRoleBudget<=0) return 1;
  return curRoleBudget/baseRoleBudget;
}
function renderBudgetStrategyHtml(){
  let html = `<div class="strat-card"><h3>💰 Budget attuale per reparto</h3>
    <div class="sub" style="font-size:12px;color:#6b7488;margin-bottom:6px;">Ricavato dagli obiettivi % impostati ora nella home (${budgetTotal} crediti totali). Cambiali lì e questa pagina si aggiorna da sola.</div>`;
  ['P','D','C','A'].forEach(r=>{
    const roleBudget = Math.round(budgetTotal*(rolePct[r]||0)/100);
    html += `<div class="macro-row"><div class="macro-role">${ROLE_LABEL[r]}</div><div class="macro-range">${rolePct[r]||0}% · ${roleBudget} cr</div></div>`;
  });
  html += `</div>`;

  const TIER_CUTS = [0.12, 0.35, 0.65, 1.0]; // percentili cumulativi del pool rilevante
  const TIER_NAMES = ['1ª fascia · Top', '2ª fascia', '3ª fascia', '4ª fascia · Completamento'];

  ['A','C','D','P'].forEach(r=>{
    const pool = PLAYERS_DATA.filter(p=>p.r===r && p.rilevante && !p.nonInListone)
      .slice().sort((a,b)=> b.prezzo - a.prezzo);
    if(pool.length===0) return;
    const factor = liveScaleFactor(r);
    html += `<div class="role-section-head"><span class="rb role-${r}">${r}</span> ${ROLE_LABEL[r]} — dal modello, scalato al tuo budget attuale</div>`;
    html += `<div class="strat-card">`;
    let start = 0;
    TIER_CUTS.forEach((cut, i)=>{
      const end = Math.round(pool.length*cut);
      const slice = pool.slice(start, end);
      if(slice.length===0){ start = end; return; }
      const prices = slice.map(p=> Math.max(1, Math.round(p.prezzo*factor)));
      const lo = Math.min(...prices), hi = Math.max(...prices);
      html += `<div class="fascia-group"><div class="fascia-title">${TIER_NAMES[i]} (${slice.length} giocatori · ${lo}-${hi}cr)</div>`;
      slice.slice(0,4).forEach((p,idx)=>{
        html += `<div class="fascia-player"><span class="fp-name">${p.nome} <span class="fp-team">${p.squadra}</span></span><span class="fp-range">${prices[idx]}cr</span></div>`;
      });
      if(slice.length>4){
        html += `<div style="font-size:11.5px; color:#98a1b3; padding:3px 0 0;">+ altri ${slice.length-4} in questa fascia</div>`;
      }
      html += `</div>`;
      start = end;
    });
    html += `</div>`;
  });

  html += `<div class="strat-tip" style="margin:0 0 12px;"><b>ℹ️</b><span>I prezzi qui sono una riscalatura proporzionale del modello (calibrato a 500cr con P9/D22/C32/A37), non un ricalcolo completo — usali come indicazione, il "prezzo consigliato" nella tab Asta resta il numero più preciso per il singolo giocatore.</span></div>`;

  return html;
}

const VERSION_DESC = {

  'bilanciata': 'Titolari scelti per miglior rapporto Fanta Media / prezzo, panchina rinforzata con quello che resta del budget di ruolo.'
};
const BEST_TITOLARI = {
  '4-4-2': {P:1,D:4,C:4,A:2},
  '3-4-3': {P:1,D:3,C:4,A:3},
  '4-3-3': {P:1,D:4,C:3,A:3},
};
const BENCH_RESERVE = {P:2, D:2, C:2, A:3};

const STAT_BY_ID = {};
STAT_PLAYERS.forEach(s => STAT_BY_ID[s.id] = s);

function effPrice(id, prezzo){
  return REAL_PRICES.hasOwnProperty(id) ? REAL_PRICES[id] : prezzo;
}
function isPriceReal(id){
  return REAL_PRICES.hasOwnProperty(id);
}

/// Ricalcola dal vivo, ogni volta che viene chiamata: usa le percentuali obiettivo
/// e il budget ATTUALI, ed esclude chi è già stato preso (da te o da altri) nell'asta in corso.
function buildBestRoster(formation, version){
  const takenIds = new Set(Object.keys(state).filter(id => state[id].status!=='free').map(Number));
  const SLOTS = {P:3,D:8,C:8,A:6};
  const roleBudget = {};
  ['P','D','C','A'].forEach(r => roleBudget[r] = Math.round(budgetTotal * (rolePct[r]||0)/100));

  const statsByRole = {P:[],D:[],C:[],A:[]};
  PLAYERS_DATA.forEach(p=>{
    if(takenIds.has(p.id)) return;
    const st = STAT_BY_ID[p.id];
    if(st) statsByRole[p.r].push({...st, nome:p.nome, squadra:p.squadra, prezzo: effPrice(p.id, p.prezzo)});
  });
  const mainByRole = {P:[],D:[],C:[],A:[]};
  PLAYERS_DATA.forEach(p=>{
    if(takenIds.has(p.id)) return;
    if(p.rilevante && !p.nonInListone) mainByRole[p.r].push({...p, prezzo: effPrice(p.id, p.prezzo)});
  });

  const tit = BEST_TITOLARI[formation];
  const usedIds = new Set();
  const roster = {P:[],D:[],C:[],A:[]};
  const roleSpend = {P:0,D:0,C:0,A:0};

  ['P','D','C','A'].forEach(role=>{
    const budget = roleBudget[role];
    const nTit = tit[role];
    const nBench = SLOTS[role] - nTit;
    const benchReserve = nBench * BENCH_RESERVE[role];
    const titBudget = Math.max(0, budget - benchReserve);

    let cand = statsByRole[role].slice();
    if(version==='stelle'){
      cand.sort((a,b)=> b.fantaMedia - a.fantaMedia);
    } else {
      cand = cand.filter(c=>c.prezzo>=4);
      cand.sort((a,b)=> (b.fantaMedia/Math.max(1,b.prezzo)) - (a.fantaMedia/Math.max(1,a.prezzo)));
    }

    let chosen = [];
    let spend = 0;
    for(const c of cand){
      if(chosen.length>=nTit) break;
      if(usedIds.has(c.id)) continue;
      if(spend + c.prezzo > titBudget) continue;
      chosen.push(c); usedIds.add(c.id); spend += c.prezzo;
    }
    if(chosen.length < nTit){
      const pool = mainByRole[role].filter(p=>!usedIds.has(p.id)).sort((a,b)=> b.fvm - a.fvm);
      for(const p of pool){
        if(chosen.length>=nTit) break;
        if(spend + p.prezzo > titBudget*1.3) continue;
        chosen.push({id:p.id, nome:p.nome, squadra:p.squadra, prezzo:p.prezzo, fantaMedia:null, presenzeAttese:null, rigorista:null});
        usedIds.add(p.id); spend += p.prezzo;
      }
    }
    if(chosen.length < nTit){
      const pool = mainByRole[role].filter(p=>!usedIds.has(p.id)).sort((a,b)=> a.prezzo - b.prezzo);
      for(const p of pool){
        if(chosen.length>=nTit) break;
        chosen.push({id:p.id, nome:p.nome, squadra:p.squadra, prezzo:p.prezzo, fantaMedia:null, presenzeAttese:null, rigorista:null});
        usedIds.add(p.id); spend += p.prezzo;
      }
    }

    chosen.forEach(c=>{
      roster[role].push({id:c.id, nome:c.nome, squadra:c.squadra, prezzo:c.prezzo, prezzoReale:isPriceReal(c.id),
                          titolare:true, fantaMedia:c.fantaMedia, presenzeAttese:c.presenzeAttese, presenzeReali:c.presenzeReali, rigorista:c.rigorista});
      roleSpend[role]+=c.prezzo;
    });

    const benchBudgetLeft = Math.max(0, budget - spend);
    const offset = version==='bilanciata' ? 4 : 0;
    let pool = mainByRole[role].filter(p=>!usedIds.has(p.id)).sort((a,b)=> b.fvm - a.fvm);
    pool = pool.slice(offset).concat(pool.slice(0,offset));
    const fillers = [];
    let benchSpend = 0;
    for(const p of pool){
      if(fillers.length>=nBench) break;
      const remaining = nBench - fillers.length;
      if(benchSpend + p.prezzo > benchBudgetLeft - (remaining-1)) continue;
      fillers.push(p); benchSpend += p.prezzo;
    }
    if(fillers.length < nBench){
      const cheapPool = mainByRole[role].filter(p=>!usedIds.has(p.id) && !fillers.includes(p)).sort((a,b)=> a.prezzo-b.prezzo);
      for(const p of cheapPool){
        if(fillers.length>=nBench) break;
        fillers.push(p);
      }
    }
    fillers.slice(0,nBench).forEach(p=>{
      roster[role].push({id:p.id, nome:p.nome, squadra:p.squadra, prezzo:p.prezzo, prezzoReale:isPriceReal(p.id),
                          titolare:false, fantaMedia:null, presenzeAttese:null, rigorista:null});
      usedIds.add(p.id);
      roleSpend[role]+=p.prezzo;
    });
  });

  const total = Object.values(roleSpend).reduce((a,b)=>a+b,0);
  return {formation, version, roster, roleSpend, total, roleBudget};
}

function findBestTeam(formation, version){
  return buildBestRoster(formation, version);
}

  el.innerHTML = html;
}
function selectBestFormation(f){ bestFormation=f; renderBestControls(); renderBestTab(); }
function selectBestVersion(v){ bestVersion=v; renderBestControls(); renderBestTab(); }
window.selectBestFormation = selectBestFormation;
window.selectBestVersion = selectBestVersion;

function renderBestTab(){
  renderBestControls();
  const el = document.getElementById('bestContent');
  const t = findBestTeam(bestFormation, bestVersion);
  if(!t){ el.innerHTML = '<div class="empty">Dati non disponibili per questa combinazione.</div>'; return; }

  const nReal = ['P','D','C','A'].reduce((s,r)=> s + t.roster[r].filter(p=>p.prezzoReale).length, 0);
  const nTaken = PLAYERS_DATA.filter(p=>state[p.id].status!=='free').length;
  let html = `<div class="strat-card" style="margin:0 12px 12px;">
    <h3>🏆 ${FORMATION_LABEL[t.formation]} — ${VERSION_LABEL[t.version]}</h3>
    <div class="sub" style="font-size:12.5px;color:#6b7488;margin-bottom:6px;">${VERSION_DESC[t.version]}</div>
    <div class="sub" style="font-size:11.5px;color:var(--green-ok);margin-bottom:4px;">💚 ${nReal}/25 prezzi sono quelli realmente pagati nella tua asta di prova del 9 settembre, il resto è stimato dal modello.</div>
    <div class="sub" style="font-size:11.5px;color:var(--blue);margin-bottom:10px;">🔄 Calcolata al volo sugli obiettivi budget attuali (P${rolePct.P}/D${rolePct.D}/C${rolePct.C}/A${rolePct.A}) ed esclude i ${nTaken} giocatori già assegnati nell'asta in corso.</div>
    <div class="rosa-summary" style="margin-bottom:0;"><span>25/25 giocatori</span><span>${t.total}/${budgetTotal} crediti</span></div>
  </div>`;

  html += `<div class="strat-card" style="margin:0 12px 12px;"><h3 style="font-size:13px;">Spesa per reparto vs obiettivo</h3>`;
  ['P','D','C','A'].forEach(r=>{
    const spent = t.roleSpend[r];
    const budget = t.roleBudget[r];
    const pct = budget>0 ? Math.min(100, spent/budget*100) : 0;
    const over = spent>budget;
    html += `<div class="macro-row"><div class="macro-role">${ROLE_LABEL[r]}</div>
      <div style="display:flex; align-items:center; gap:8px; flex:1; max-width:200px; margin-left:12px;">
        <span class="tp-bar-track" style="flex:1;"><span class="tp-bar-fill ${over?'over':''}" style="width:${pct}%"></span></span>
        <span class="macro-range" style="color:${over?'var(--red)':'var(--amber-deep)'};">${spent}/${budget}</span>
      </div></div>`;
  });
  html += `</div>`;

  ['P','D','C','A'].forEach(r=>{
    const players = t.roster[r];
    const titolari = players.filter(p=>p.titolare);
    const panchina = players.filter(p=>!p.titolare);
    html += `<div class="role-section-head" style="margin:0 12px 10px;"><span class="rb role-${r}">${r}</span> ${ROLE_LABEL[r]} (${players.length})</div>`;
    html += `<div class="strat-card" style="margin:0 12px 12px;">`;
    html += `<div class="fascia-title">Titolari</div>`;
    titolari.forEach(p=>{
      const fmLabel = p.presenzeReali!=null ? 'FM reale' : 'FM attesa';
      const presLine = p.presenzeReali!=null ? p.presenzeReali+' presenze giocate' : (p.presenzeAttese!=null ? p.presenzeAttese+' presenze attese' : '');
      const stat = p.fantaMedia ? `<div class="best-stat">${fmLabel} ${p.fantaMedia}${presLine?' · '+presLine:''}${p.rigorista?' · 🎯 '+p.rigorista:''}</div>` : '';
      const priceTag = p.prezzoReale ? `<div class="price-src real">pagato ieri</div>` : `<div class="price-src est">stimato</div>`;
      html += `<div class="fascia-player" style="align-items:flex-start;"><span class="fp-name">${p.nome} <span class="fp-team">${p.squadra}</span>${stat}</span><span style="text-align:right;"><span class="fp-range" style="color:var(--amber-deep); font-weight:700; display:block;">${p.prezzo}cr</span>${priceTag}</span></div>`;
    });
    if(panchina.length>0){
      html += `<div class="fascia-title" style="margin-top:12px;">Panchina</div>`;
      panchina.forEach(p=>{
        const priceTag = p.prezzoReale ? `<div class="price-src real">ieri</div>` : `<div class="price-src est">stima</div>`;
        html += `<div class="fascia-player"><span class="fp-name" style="color:#6b7488;">${p.nome} <span class="fp-team">${p.squadra}</span></span><span style="text-align:right;"><span class="fp-range" style="display:block;">${p.prezzo}cr</span>${priceTag}</span></div>`;
      });
    }
    html += `</div>`;
  });

  el.innerHTML = html;
  el.dataset.built = '1';
}


document.getElementById('search').addEventListener('input', e=>{
  filters.q = e.target.value; render();
});
document.getElementById('roleFilters').addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#roleFilters .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  filters.role = btn.dataset.role;
  render();
});
document.getElementById('chkConsigliati').addEventListener('change', e=>{
  filters.onlyRec = e.target.checked;
  document.getElementById('toggleConsigliati').classList.toggle('on', e.target.checked);
  render();
});
document.getElementById('chkPersonal').addEventListener('change', e=>{
  filters.onlyPersonal = e.target.checked;
  document.getElementById('togglePersonal').classList.toggle('on', e.target.checked);
  render();
});
document.getElementById('chkHide').addEventListener('change', e=>{
  filters.hideAssigned = e.target.checked;
  document.getElementById('toggleHide').classList.toggle('on', e.target.checked);
  render();
});
document.getElementById('toggleHide').classList.add('on');
document.getElementById('chkHideInjury').addEventListener('change', e=>{
  filters.hideInjury = e.target.checked;
  document.getElementById('toggleHideInjury').classList.toggle('on', e.target.checked);
  render();
});
document.getElementById('budgetInput').addEventListener('input', e=>{
  const v = parseInt(e.target.value,10);
  budgetTotal = isNaN(v) ? 500 : v;
  render();
  document.getElementById('strategiaContent').dataset.built = '';
  if(currentTab==='rosa') renderRosaTab();
  if(currentTab==='strategia') renderStrategiaTab();
  if(currentTab==='best') renderBestTab();
});

render();
updateBkStatus();

/* ===================== PANNELLO OBIETTIVI/BACKUP ESPANDIBILE =====================
   Vive FUORI dalla barra sticky (vedi HTML: #extraPanel è un fratello di #budgetbar,
   non un figlio), quindi aprirlo/chiuderlo si limita a spingere giù o su il contenuto
   sotto in modo normale — non tocca mai la barra sticky, niente più salti di scroll. */
function toggleBudgetbarExpand(){
  const panel = document.getElementById('extraPanel');
  const btn = document.getElementById('expandToggleBar');
  const willOpen = !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
  btn.classList.toggle('open', willOpen);
}
window.toggleBudgetbarExpand = toggleBudgetbarExpand;
</script>
